<svg width="100%" viewBox="0 0 680 940" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SME AI 주치의 라우팅 에이전트 파이프라인</title>
<desc>사용자 문의가 분류 후, 범위밖이거나 확신도가 낮으면 바로 넘기기로 가고, 아니면 근거조회-답변생성-검증을 거쳐 검증에 실패하면 다시 넘기기로, 통과하면 최종 응답으로 이어지는 LangGraph 파이프라인 구조도</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #F1EFE8; stroke: #888780; }
  .amber { fill: #FAEEDA; stroke: #BA7517; }
  .amber .th, .amber .ts { fill: #633806; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; }
</style>

<rect x="180" y="20" width="240" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="300" y="42" text-anchor="middle" dominant-baseline="central">사용자 문의</text>
<line x1="300" y1="64" x2="300" y2="124" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="124" width="240" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="300" y="142" text-anchor="middle" dominant-baseline="central">분류 (classify_node)</text>
<text class="ts" x="300" y="160" text-anchor="middle" dominant-baseline="central">카테고리 + 확신도 · gpt-4o-mini</text>
<line x1="300" y1="180" x2="300" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="240" width="240" height="56" rx="8" class="amber" stroke-width="0.5"/>
<text class="th amber" x="300" y="258" text-anchor="middle" dominant-baseline="central">범위밖 / 저확신?</text>
<text class="ts amber" x="300" y="276" text-anchor="middle" dominant-baseline="central">확신도 0.6 미만</text>
<line x1="300" y1="296" x2="300" y2="356" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="312" y="326" text-anchor="start">아니오</text>
<path d="M420 268 L435 268 L435 472 L450 472" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="427" y="252" text-anchor="start">예</text>

<rect x="180" y="356" width="240" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="300" y="374" text-anchor="middle" dominant-baseline="central">근거 조회 (retrieve_node)</text>
<text class="ts" x="300" y="392" text-anchor="middle" dominant-baseline="central">카테고리별 섹션만</text>
<line x1="300" y1="412" x2="300" y2="472" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="472" width="240" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="300" y="490" text-anchor="middle" dominant-baseline="central">답변 생성 (answer_node)</text>
<text class="ts" x="300" y="508" text-anchor="middle" dominant-baseline="central">근거만으로 답변 · gpt-4o-mini</text>
<line x1="300" y1="528" x2="300" y2="588" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="588" width="240" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="300" y="606" text-anchor="middle" dominant-baseline="central">검증 (verify_node)</text>
<text class="ts" x="300" y="624" text-anchor="middle" dominant-baseline="central">근거 이탈 여부 · gpt-4o</text>
<line x1="300" y1="644" x2="300" y2="704" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="704" width="240" height="56" rx="8" class="amber" stroke-width="0.5"/>
<text class="th amber" x="300" y="722" text-anchor="middle" dominant-baseline="central">검증 통과?</text>
<text class="ts amber" x="300" y="740" text-anchor="middle" dominant-baseline="central">지어낸 내용 없음</text>
<line x1="300" y1="760" x2="300" y2="820" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="312" y="790" text-anchor="start">예</text>
<path d="M420 732 L435 732 L435 528 L450 528" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="424" y="722" text-anchor="start">아니오</text>

<rect x="180" y="820" width="240" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="300" y="842" text-anchor="middle" dominant-baseline="central">최종 응답 반환</text>

<rect x="450" y="472" width="190" height="56" rx="8" class="amber" stroke-width="0.5"/>
<text class="th amber" x="545" y="490" text-anchor="middle" dominant-baseline="central">넘기기 (escalate_node)</text>
<text class="ts amber" x="545" y="508" text-anchor="middle" dominant-baseline="central">안내범위 섹션 포함</text>
<path d="M545 528 L545 842 L420 842" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="890" width="14" height="14" rx="3" class="box" stroke-width="0.5"/>
<text class="ts" x="202" y="897" dominant-baseline="central">정상 흐름</text>
<rect x="300" y="890" width="14" height="14" rx="3" class="amber" stroke-width="0.5"/>
<text class="ts" x="322" y="897" dominant-baseline="central">판정 · 넘기기 경로</text>
</svg>
